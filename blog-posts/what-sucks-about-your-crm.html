<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHYCN9WWRX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LHYCN9WWRX');
  </script>

  <meta charset="UTF-8" />
  <title>What Sucks Most About Your CRM? – Seamless Outbound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            soDark: "#050510",
            hubOrange: "#FF7A59",
            soBlue: "#3DA9FC",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-soDark text-white font-sans selection:bg-hubOrange selection:text-black overflow-x-hidden min-h-screen flex flex-col justify-between">

  <!-- Header -->  
  <header class="sticky top-0 z-50 border-b border-white/10 bg-black/40 backdrop-blur py-4">
    <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html"><img src="/photos/logo.png" alt="logo" class="h-16 md:h-20 w-auto object-contain" /></a>
      <a href="../blog.html" class="text-xs font-mono text-gray-400 hover:text-hubOrange transition">← Back to Insights</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10 w-full flex-grow">

    <!-- Big Prominent Section Title -->
    <h2 id="main-section-title" class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white mb-4 flex items-center gap-3">
      <span class="w-2.5 h-2.5 bg-hubOrange rounded-full inline-block animate-pulse shrink-0"></span>
      <span id="custom-top-title"><span id="prospect-name-display" class="text-hubOrange">Hi there</span>, what sucks most about your CRM?</span>
    </h2>

    <!-- Centered Eyes Block Watching Cursor -->
    <div class="flex flex-col items-center justify-center my-6 z-30" id="eyes-wrapper">
      <div class="mb-2 bg-hubOrange/10 border border-hubOrange/50 px-3 py-1 rounded-lg shadow-lg backdrop-blur-md">
        <p class="text-[11px] font-mono text-hubOrange font-bold tracking-wide animate-pulse">
          watching your pipeline
        </p>
      </div>

      <div class="flex items-center justify-center p-2 relative group" id="eyes-container">
        <div class="w-5 h-1 bg-hubOrange rounded-l-full -mr-1 z-10"></div>
        <div class="w-20 h-14 bg-black border-2 border-hubOrange rounded-[50%_50%_45%_45%] flex items-center justify-center overflow-hidden relative shadow-lg shadow-soBlue/40">
          <div class="w-8 h-10 bg-soBlue rounded-full transition-all duration-75 shadow-inner absolute flex items-center justify-center overflow-hidden" id="pupil-1">
            <div class="w-3 h-4 bg-black rounded-full flex items-center justify-center relative">
              <div class="w-1.5 h-1.5 bg-white rounded-full absolute transition-all duration-75" id="catchlight-1" style="top: 25%; left: 30%;"></div>
            </div>
          </div>
        </div>
        <div class="w-3 h-1 bg-hubOrange"></div>
        <div class="w-20 h-14 bg-black border-2 border-hubOrange rounded-[50%_50%_45%_45%] flex items-center justify-center overflow-hidden relative shadow-lg shadow-soBlue/40">
          <div class="w-8 h-10 bg-soBlue rounded-full transition-all duration-75 shadow-inner absolute flex items-center justify-center overflow-hidden" id="pupil-2">
            <div class="w-3 h-4 bg-black rounded-full flex items-center justify-center relative">
              <div class="w-1.5 h-1.5 bg-white rounded-full absolute transition-all duration-75" id="catchlight-2" style="top: 25%; left: 30%;"></div>
            </div>
          </div>
        </div>
        <div class="w-5 h-1 bg-hubOrange rounded-r-full -ml-1 z-10"></div>
      </div>
    </div>
    
    <!-- Diagnostic Tool App Widget -->
    <div class="bg-black/90 border border-hubOrange/40 rounded-2xl p-6 md:p-8 mb-8 shadow-2xl shadow-hubOrange/10 relative overflow-visible">
      
      <!-- Top Status Bar -->
      <div class="flex items-center justify-between mb-6 pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-hubOrange animate-pulse"></div>
          <span class="text-[11px] uppercase tracking-widest text-hubOrange font-bold font-mono">Pipeline Friction Diagnostic</span>
        </div>
        <div id="step-counter" class="text-xs text-gray-400 font-mono tracking-wider">Question 1 of 5</div>
      </div>

      <!-- Question View -->
      <div id="diagnostic-question-container">
        <h3 id="question-title" class="text-lg md:text-xl font-bold text-white mb-5 leading-snug"></h3>
        <div id="options-grid" class="space-y-3"></div>

        <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/5">
          <button id="back-btn" onclick="prevQuestion()" class="text-xs uppercase tracking-wider text-gray-400 hover:text-white transition hidden flex items-center gap-1 font-mono">
            ← Previous
          </button>
          <div id="progress-pips" class="flex space-x-1.5 mx-auto">
            <div class="w-5 h-1.5 bg-hubOrange rounded-full transition-all duration-300" data-pip="0"></div>
            <div class="w-1.5 h-1.5 bg-white/20 rounded-full transition-all duration-300" data-pip="1"></div>
            <div class="w-1.5 h-1.5 bg-white/20 rounded-full transition-all duration-300" data-pip="2"></div>
            <div class="w-1.5 h-1.5 bg-white/20 rounded-full transition-all duration-300" data-pip="3"></div>
            <div class="w-1.5 h-1.5 bg-white/20 rounded-full transition-all duration-300" data-pip="4"></div>
          </div>
        </div>
      </div>

      <!-- Result State -->
      <div id="diagnostic-result-container" class="hidden space-y-5">
        <div>
          <div class="text-xs uppercase tracking-widest text-hubOrange font-mono mb-1">Diagnostic Complete</div>
          <h3 class="text-xl font-black text-white">Pipeline Friction Index: <span id="friction-score" class="text-hubOrange">High Drag</span></h3>
        </div>
        
        <div id="result-diagnosis" class="text-gray-300 text-sm leading-relaxed space-y-2 bg-white/5 p-4 rounded-xl border border-white/10 font-mono">
          <!-- Injected findings -->
        </div>

        <div class="pt-2">
          <p id="result-cta-text" class="text-sm text-white font-medium mb-4"></p>
          <a href="https://calendly.com/seamlessoutbound/30-minute-meeting" class="block w-full text-center py-3.5 bg-hubOrange text-black font-bold rounded-xl hover:bg-orange-600 transition uppercase tracking-wider text-xs shadow-lg shadow-hubOrange/20">      
            Book a Pipeline Audit    
          </a>  
        </div>
        
        <div class="text-center pt-2">
          <button onclick="resetDiagnostic()" class="text-xs text-gray-500 hover:text-hubOrange transition uppercase tracking-wider font-mono">↺ Retake Diagnostic</button>
        </div>
      </div>

    </div>

  </main>

  <footer class="border-t border-white/10 py-6 text-center text-xs text-gray-500 font-mono">
    Seamless Outbound &copy; 2026 – Are you open to having a better Sales pipeline?
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const firstName = urlParams.get('name') || '';
    const companyName = urlParams.get('company') || '';
    const crmPlatform = urlParams.get('crm') || '';

    const formattedCompanyName = companyName ? decodeURIComponent(companyName).replace(/\+/g, ' ') : '';
    const formattedCrm = crmPlatform ? decodeURIComponent(crmPlatform) : '';

    const displayName = firstName ? `${firstName}` : "Hi there";
    const displayCrm = formattedCrm ? `${formattedCrm} CRM` : "CRM";

    document.getElementById('prospect-name-display').innerText = displayName;
    
    const topTitleText = formattedCrm 
      ? `what sucks most about your ${formattedCrm} CRM?`
      : `what sucks most about your CRM?`;
    document.getElementById('custom-top-title').innerHTML = `<span id="prospect-name-display" class="text-hubOrange">${displayName}</span>, ${topTitleText}`;

    const resultCtaText = document.getElementById('result-cta-text');
    if (firstName) {
      resultCtaText.innerHTML = `<span class="text-hubOrange font-semibold">${firstName}</span>, let's fix these issues with your pipeline!`;
    } else {
      resultCtaText.innerHTML = "Are you open to having a better Sales pipeline?";
    }

    const diagnosticQuestions = [
      {
        question: `Hey ${displayName}, what is the single biggest bottleneck slowing down growth ${formattedCompanyName ? 'at ' + formattedCompanyName : 'in your pipeline'}?`,
        options: [
          { text: "Systems not talking to each other (sync failures & broken webhooks)", signal: "Broken Data Sync Layer", weight: 3 },
          { text: "Reps drowning in manual data entry & click fatigue (the 5-tab shuffle)", signal: "High Rep Administrative Drag", weight: 3 },
          { text: "A bloated pipeline full of ghost data nobody trusts", signal: "Stale Pipeline / Ghost Records", weight: 2 }
        ]
      },
      {
        question: `How many hours a week do reps ${formattedCompanyName ? 'at ' + formattedCompanyName : ''} spend updating ${displayCrm} manually?`,
        options: [
          { text: "Under 5 hours — Mostly automated workflows", signal: "Healthy Automation Baseline", weight: 1 },
          { text: "5 to 15 hours — Moderate administrative drag", signal: "Moderate Time Drain on Reps", weight: 2 },
          { text: "Over 15 hours — The machine is eating our week", signal: "Severe Capacity Bottleneck", weight: 3 }
        ]
      },
      {
        question: `When scaling outbound campaigns for ${formattedCompanyName || 'your business'}, how clean is the cross-platform data sync?`,
        options: [
          { text: "Seamless automated integration across tools", signal: "Stable API Layer", weight: 1 },
          { text: "Constant manual copy-pasting between separate tabs", signal: "Manual Bridging Friction", weight: 2 },
          { text: "Total chaos — data constantly drops or duplicates", signal: "Critical Webhook Failures", weight: 3 }
        ]
      },
      {
        question: `What does your Friday afternoon pipeline review actually feel like ${formattedCompanyName ? 'at ' + formattedCompanyName : ''}?`,
        options: [
          { text: "Predictable, calm, and accurate pipeline forecasts", signal: "Reliable Deal Visibility", weight: 1 },
          { text: "A guessing game of outdated deal stages", signal: "Obscured Pipeline Velocity", weight: 2 },
          { text: "A graveyard of dead or neglected deals", signal: "High Ratio of Stagnant Deals", weight: 3 }
        ]
      },
      {
        question: `Final check: Does your CRM have room for improvement?`,
        options: [
          { text: "Yes, absolutely — it needs a major cleanup", signal: "Active Desire for Pipeline Optimization", weight: 3 },
          { text: "Somewhat — there are always leaks to plug", signal: "Incremental Growth Potential", weight: 2 },
          { text: "Not sure, but we're open to a better system", signal: "Open to Stack Modernization", weight: 1 }
        ]
      }
    ];

    let activeStep = 0;
    const collectedSignals = [];
    let totalScore = 0;

    const questionTitle = document.getElementById('question-title');
    const optionsGrid = document.getElementById('options-grid');
    const stepCounter = document.getElementById('step-counter');
    const backBtn = document.getElementById('back-btn');
    const progressPips = document.querySelectorAll('[data-pip]');

    function renderActiveQuestion() {
      const currentQ = diagnosticQuestions[activeStep];
      questionTitle.innerText = currentQ.question;
      stepCounter.innerText = `Question ${activeStep + 1} of 5`;

      if (activeStep > 0) {
        backBtn.classList.remove('hidden');
      } else {
        backBtn.classList.add('hidden');
      }

      progressPips.forEach((pip, idx) => {
        if (idx === activeStep) {
          pip.className = "w-5 h-1.5 bg-hubOrange rounded-full transition-all duration-300";
        } else if (idx < activeStep) {
          pip.className = "w-1.5 h-1.5 bg-hubOrange/60 rounded-full transition-all duration-300";
        } else {
          pip.className = "w-1.5 h-1.5 bg-white/20 rounded-full transition-all duration-300";
        }
      });

      optionsGrid.innerHTML = '';
      currentQ.options.forEach((opt) => {
        const optionButton = document.createElement('button');
        optionButton.className = "w-full text-left p-3.5 rounded-xl border border-white/10 bg-white/5 hover:border-hubOrange hover:bg-hubOrange/10 transition-all duration-200 text-xs md:text-sm text-gray-200 flex items-center justify-between group cursor-pointer";
        optionButton.innerHTML = `<span class="font-medium leading-relaxed pr-4">${opt.text}</span> <span class="text-hubOrange opacity-0 group-hover:opacity-100 transition-opacity text-xs font-mono shrink-0">Select →</span>`;
        optionButton.onclick = () => submitAnswer(opt.signal, opt.weight);
        optionsGrid.appendChild(optionButton);
      });
    }

    function submitAnswer(signalText, weight) {
      collectedSignals.push(signalText);
      totalScore += weight;
      if (activeStep < diagnosticQuestions.length - 1) {
        activeStep++;
        renderActiveQuestion();
      } else {
        renderResults();
      }
    }

    function prevQuestion() {
      if (activeStep > 0) {
        activeStep--;
        collectedSignals.pop();
        totalScore -= 2; // approximation for undo step weight fallback
        renderActiveQuestion();
      }
    }

    function resetDiagnostic() {
      activeStep = 0;
      totalScore = 0;
      collectedSignals.length = 0;
      document.getElementById('diagnostic-result-container').classList.add('hidden');
      document.getElementById('diagnostic-question-container').classList.remove('hidden');
      renderActiveQuestion();
    }

    function renderResults() {
      document.getElementById('diagnostic-question-container').classList.add('hidden');
      document.getElementById('diagnostic-result-container').classList.remove('hidden');
      stepCounter.innerText = 'Diagnostic Complete';

      // Dynamic Friction Score based on total accumulated weight
      let frictionLabel = "High Drag (Critical Optimization Needed)";
      if (totalScore <= 6) {
        frictionLabel = "Low Drag (Optimized Baseline)";
      } else if (totalScore <= 10) {
        frictionLabel = "Moderate Drag (Friction Detected)";
      }
      document.getElementById('friction-score').innerText = frictionLabel;

      const companyRef = formattedCompanyName ? `at ${formattedCompanyName}` : "in your outbound stack";
      
      let htmlOutput = `<div class="text-hubOrange font-bold mb-2">// DETECTED PIPELINE BLOCKERS (${companyRef}):</div>`;
      collectedSignals.slice(0, 3).forEach((sig, idx) => {
        htmlOutput += `<div>[${idx + 1}] ${sig}</div>`;
      });
      htmlOutput += `<div class="text-gray-400 mt-3 pt-2 border-t border-white/10 text-xs">Recommendation: Replace manual tabs and syncing leaks with a clean outbound pipeline architecture.</div>`;

      document.getElementById('result-diagnosis').innerHTML = htmlOutput;
    }

    renderActiveQuestion();

    // Eye Tracking Logic
    const eyesContainer = document.getElementById('eyes-container');
    const pupil1 = document.getElementById('pupil-1');
    const pupil2 = document.getElementById('pupil-2');
    const catchlight1 = document.getElementById('catchlight-1');
    const catchlight2 = document.getElementById('catchlight-2');

    document.addEventListener('mousemove', (e) => {
      const rect = eyesContainer.getBoundingClientRect();
      const rX = rect.left + rect.width / 2;
      const rY = rect.top + rect.height / 2;
      
      const angle = Math.atan2(e.clientY - rY, e.clientX - rX);
      const distance = Math.min(4, Math.hypot(e.clientX - rX, e.clientY - rY) / 35);
      
      const pX = Math.cos(angle) * distance;
      const pY = Math.sin(angle) * distance;

      pupil1.style.transform = `translate(${pX}px, ${pY}px)`;
      pupil2.style.transform = `translate(${pX}px, ${pY}px)`;

      const cX = pX * 0.35;
      const cY = pY * 0.35;
      catchlight1.style.transform = `translate(${cX}px, ${cY}px)`;
      catchlight2.style.transform = `translate(${cX}px, ${cY}px)`;
    });
  </script>
</body>
</html>
