<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Outbound Link Generator – Seamless Outbound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            soDark: "#050510",
            hubOrange: "#FF7A59",
            soBlue: "#3DA9FC",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-soDark text-white font-sans selection:bg-hubOrange selection:text-black min-h-screen flex flex-col justify-between">

  <!-- Header -->  
  <header class="border-b border-white/10 bg-black/40 backdrop-blur py-4">
    <div class="max-w-4xl mx-auto px-4 flex items-center justify-between">
      <a href="../index.html"><img src="../photos/logo.png" alt="logo" class="h-16 md:h-20 w-auto object-contain" /></a>
      <a href="../admin.html" class="text-xs uppercase tracking-wider text-hubOrange hover:underline font-mono">← Internal Dashboard</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-16 w-full">

    <div class="mb-8 text-center">
      <span class="inline-block w-3 h-3 bg-hubOrange rounded-full animate-pulse mb-2"></span>
      <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white mb-2">Cold Call & Outreach Link Generator</h1>
      <p class="text-xs text-gray-400 font-mono">Type prospect details below to generate a clean, parameterized link without polluting analytics tracking.</p>
    </div>

    <!-- Standalone Generator Widget -->
    <div class="bg-black/90 border-2 border-hubOrange/60 rounded-2xl p-6 md:p-8 shadow-2xl shadow-hubOrange/10">
      
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-[11px] uppercase tracking-wider text-gray-400 font-mono mb-1">Prospect First Name</label>
          <input type="text" id="gen-name" placeholder="e.g. John" class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-sm text-white focus:border-hubOrange outline-none transition" oninput="updateGeneratedLink()" />
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-gray-400 font-mono mb-1">Company Name</label>
          <input type="text" id="gen-company" placeholder="e.g. Acme Corp" class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-sm text-white focus:border-hubOrange outline-none transition" oninput="updateGeneratedLink()" />
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-gray-400 font-mono mb-1">CRM Platform</label>
          <select id="gen-crm" class="w-full bg-black border border-white/20 rounded-lg px-3 py-2.5 text-sm text-white focus:border-hubOrange outline-none transition" onchange="updateGeneratedLink()">
            <option value="">General CRM</option>
            <option value="HubSpot">HubSpot</option>
            <option value="Close">Close</option>
          </select>
        </div>
      </div>

      <div class="border-t border-white/10 pt-6">
        <label class="block text-[11px] uppercase tracking-wider text-hubOrange font-mono mb-2 font-bold">Generated Link (Ready to Copy)</label>
        <div class="flex items-center gap-2">
          <input type="text" id="gen-output" readonly class="w-full bg-black border border-hubOrange/40 rounded-lg px-3 py-2.5 font-mono text-xs text-hubOrange select-all" value="https://seamlessoutbound.com/blog-posts/what-sucks-about-your-crm.html" />
          <button onclick="copyGeneratedLink()" class="bg-hubOrange hover:bg-orange-600 text-black font-bold px-5 py-2.5 rounded-lg text-xs uppercase tracking-wider transition shrink-0 cursor-pointer">Copy</button>
        </div>
        <p id="copy-status" class="text-[11px] text-green-400 font-mono mt-2 h-4"></p>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-6 text-center text-xs text-gray-500 font-mono">
    Seamless Outbound &copy; 2026 — Internal Operations
  </footer>

  <script>
    function updateGeneratedLink() {
      const nameVal = document.getElementById('gen-name').value.trim();
      const compVal = document.getElementById('gen-company').value.trim();
      const crmVal = document.getElementById('gen-crm').value;
      
      let baseUrl = "https://seamlessoutbound.com/blog-posts/what-sucks-about-your-crm.html";
      let params = [];
      
      if (nameVal) params.push(`name=${encodeURIComponent(nameVal)}`);
      if (compVal) params.push(`company=${encodeURIComponent(compVal)}`);
      if (crmVal) params.push(`crm=${encodeURIComponent(crmVal)}`);
      
      if (params.length > 0) {
        baseUrl += "?" + params.join("&");
      }
      
      document.getElementById('gen-output').value = baseUrl;
    }

    function copyGeneratedLink() {
      const outputBox = document.getElementById('gen-output');
      outputBox.select();
      outputBox.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(outputBox.value);
      
      const status = document.getElementById('copy-status');
      status.innerText = "✓ Link copied to clipboard!";
      setTimeout(() => {
        status.innerText = "";
      }, 2000);
    }
  </script>
</body>
</html>
